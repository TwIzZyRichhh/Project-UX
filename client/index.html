<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body>
    <nav class="flex justify-center gap-50 m-5 border-gray border-2 p-3 rounded-2xl">
      <button class="bg-gray-400 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">
        Koti
      </button>

      <button class="bg-gray-400 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">
        Ravintolat
      </button>

      <button class="bg-gray-400 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">
        Meistä
      </button>

      <button class="bg-gray-400 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md" id="login-btn">Kirjaudu</button>

      <dialog id="login-modal" class="m-auto rounded p-6 shadow-2xl backdrop:bg-black/50">
        <h2 class="font-bold text-xl mb-4">Kirjaudu sisään</h2>
        <form id="login-form" class="flex flex-col gap-3">
          <input id="login-username" type="text" placeholder="Käyttäjänimi" required
                class="border rounded p-2" />
          <input id="login-password" type="password" placeholder="Salasana" required
                class="border rounded p-2" />
          <p id="login-virhe" class="text-red-600 text-sm"></p>
          <div class="flex gap-2 justify-end">
            <button type="button" id="login-sulje" class="border rounded px-4 py-2">Peruuta</button>
            <button type="submit" class="border-2 border-black bg-white rounded px-4 py-2 font-bold">
              Kirjaudu
            </button>
          </div>
        </form>
      </dialog>
    </nav>

    <div id="ravintolat" class="grid grid-cols-3 gap-10 m-10"></div>

    <dialog id="menu-modal" class="m-auto rounded-lg p-6 w-full max-w-lg backdrop:bg-black/50">
      <div class="flex justify-between items-center mb-4">
        <h2 id="modal-otsikko" class="font-bold text-xl"></h2>
        <button id="modal-sulje" class="font-bold py-1 px-3 rounded-md border-2 border-black hover:bg-gray-200">
          Sulje
        </button>
      </div>
      <div id="modal-sisalto"></div>
    </dialog>
        
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
